<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yoneko Payment</title>

<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#fff8fc;
    --pink:#ff8fbc;
    --pink-light:#ffd8e8;
    --brown:#7b5338;
    --white:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Mitr',sans-serif;
    background:
    radial-gradient(circle,#ffffff 2px,transparent 2px);
    background-size:26px 26px;
    background-color:var(--bg);
    color:var(--brown);
    padding:30px 20px 60px;
}

.container{
    max-width:420px;
    margin:auto;
}

.title{
    text-align:center;
    color:var(--pink);
    font-size:28px;
    font-weight:600;
    margin-bottom:25px;
}

/* =========================
   QR FRAME
========================= */

.qr-frame{
    background:#fff;
    border:2px solid var(--pink-light);
    border-radius:34px;
    padding:12px;
    box-shadow:0 10px 25px rgba(255,143,188,.08);
}

.qr-inner{
    border:1px solid #f3d7e3;
    border-radius:26px;
    overflow:hidden;
    padding:10px;
}

.qr-inner img{
    width:100%;
    display:block;
    border-radius:18px;
}

/* =========================
   PLAYER
========================= */

.player{
    text-align:center;
    margin-top:18px;
}

.time{
    font-size:15px;
    margin-bottom:15px;
    color:var(--brown);
}

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:40px;
    margin-top:12px;
}

.control-btn{
    color:var(--brown);
    font-size:22px;
    font-weight:500;
    user-select:none;
}

/* =========================
   SECTION
========================= */

.section{
    margin-top:28px;
}

.line{
    width:100%;
    height:1px;
    background:var(--pink-light);
    margin-bottom:18px;
}

.label{
    color:var(--pink);
    font-size:13px;
    letter-spacing:2px;
    margin-bottom:10px;
}

.center-label{
    text-align:center;
}

.center-value{
    text-align:center;
    font-size:20px;
    font-weight:500;
}

.value{
    font-size:17px;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
}

.copy-btn{
    border:none;
    background:#fff0f6;
    color:var(--pink);
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    font-family:'Mitr',sans-serif;
    transition:.2s;
}

.copy-btn:hover{
    transform:translateY(-2px);
}

.small-note{
    margin-top:8px;
    font-size:12px;
    opacity:.75;
}

.center{
    text-align:center;
}

/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;
    margin-top:25px;
}

.footer h3{
    color:var(--pink);
    font-weight:500;
    font-size:18px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    background:var(--pink);
    color:white;
    padding:10px 18px;
    border-radius:999px;
    opacity:0;
    transition:.3s;
    pointer-events:none;
}

.toast.show{
    opacity:1;
}

</style>
</head>
<body>

<div class="container">

    <!-- TITLE -->

    <div class="title">
        ♡ Yoneko Payment ♡
    </div>

    <!-- QR -->

    <div class="qr-frame">

        <div class="qr-inner">

            <!-- เปลี่ยน URL รูป QR ตรงนี้ -->

            <img src="https://via.placeholder.com/800x800.png?text=QR+CODE" alt="QR Code">

        </div>

    </div>

    <!-- PLAYER -->

    <div class="player">

        <div class="time">
            2:57 ───────♡─────── 5:20
        </div>

        <div class="controls">

            <span class="control-btn">◀◀</span>

            <span class="control-btn">❚❚</span>

            <span class="control-btn">▶▶</span>

        </div>

    </div>

    <!-- ACCOUNT NAME -->

    <div class="section">

        <div class="line"></div>

        <div class="label center-label">
            ♡ ACCOUNT NAME ♡
        </div>

        <div class="center-value">
            Yoneko Store
        </div>

    </div>

    <!-- BANK ACCOUNT -->

    <div class="section">

        <div class="line"></div>

        <div class="label">
            BANK ACCOUNT
        </div>

        <div class="row">

            <div class="value">
                123-4-56789-0
            </div>

            <button class="copy-btn"
            onclick="copyText('123-4-56789-0')">
                คัดลอก
            </button>

        </div>

    </div>

    <!-- TRUE WALLET -->

    <div class="section">

        <div class="line"></div>

        <div class="label">
            TRUE WALLET
        </div>

        <div class="row">

            <div class="value">
                080-123-4567
            </div>

            <button class="copy-btn"
            onclick="copyText('080-123-4567')">
                คัดลอก
            </button>

        </div>

    </div>

    <!-- NOTE -->

    <div class="section">

        <div class="line"></div>

        <div class="label">
            NOTE
        </div>

        <div class="row">

            <div class="value">
                โอนเงินให้ยัยมิ
            </div>

            <button class="copy-btn"
            onclick="copyText('โอนเงินให้ยัยมิ')">
                คัดลอก
            </button>

        </div>

        <div class="small-note">
            * ลูกค้าใหม่ลืมโน๊ตปรับ 5 บาท
        </div>

    </div>

    <!-- NOTICE -->

    <div class="section">

        <div class="line"></div>

        <div class="small-note center">
            หมายเหตุ: เช็คชื่อบัญชีทุกครั้งก่อนทำรายการ
        </div>

    </div>

    <div class="section">
        <div class="line"></div>
    </div>

    <!-- FOOTER -->

    <div class="footer">

        <h3>
            Thank you for your order ♡
        </h3>

    </div>

</div>

<!-- TOAST -->

<div id="toast" class="toast">
    คัดลอกแล้ว ♡
</div>

<script>

function copyText(text){

    navigator.clipboard.writeText(text);

    const toast = document.getElementById("toast");

    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 1500);

}

</script>

</body>
</html>
